# Builds, tests and deploys the site to Cloudflare Pages (project: menshairtostay).
#
# - Pull requests: build, test, and deploy a preview at pr-<number>.menshairtostay.pages.dev (never live). A post that fails validation fails here,
#   which is what blocks a bad generated post from being merged.
# - Push to main: build, test, then deploy.
#
# Pushes to main deploy to PRODUCTION (menshairtostay.co.uk). Stage 1 of the
# rollout deployed to a preview URL first; see AUTOMATION.md task 0b.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # "main" = production (menshairtostay.co.uk). Anything else = preview URL.
  DEPLOY_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4 pages deploy dist
          --project-name=menshairtostay
          --branch="$DEPLOY_BRANCH"
          --commit-hash="${{ github.sha }}"
          --commit-message="$(git log -1 --format=%s)"

      # Pull requests (each new blog post) get their own preview site, so the
      # post can be read in the real design before it is approved. Never live.
      - name: Deploy PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name=menshairtostay \
            --branch="pr-${{ github.event.pull_request.number }}" \
            --commit-hash="${{ github.event.pull_request.head.sha }}" \
            --commit-message="Preview of PR #${{ github.event.pull_request.number }}"
          echo "Preview: https://pr-${{ github.event.pull_request.number }}.menshairtostay.pages.dev" >> "$GITHUB_STEP_SUMMARY"
